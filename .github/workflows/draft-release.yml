name: Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 3.6.0)'
        required: true
        type: string
      previous_tag:
        description: 'Previous tag for generated release notes (e.g. v3.7.13)'
        required: false
        type: string

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}

    steps:
      - name: Normalize version
        run: echo "VERSION=${VERSION#v}" >> $GITHUB_ENV

      - name: Normalize previous tag
        if: env.PREVIOUS_TAG != ''
        run: echo "PREVIOUS_TAG=v${PREVIOUS_TAG#v}" >> $GITHUB_ENV

      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: Version must be a semantic version such as 3.7.14 or 3.7.14-beta.1"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 3.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify tag does not exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Error: Tag v${VERSION} already exists"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Create release branch
        run: |
          branch="release/v${VERSION}"

          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "Error: Branch ${branch} already exists"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --create "${branch}"
          git add -f dist/
          git commit -m "Build assets for v${VERSION}"
          git push --set-upstream origin "${branch}"
          echo "RELEASE_TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            "v${VERSION}"
            --draft
            --target "${RELEASE_TARGET}"
            --title "v${VERSION}"
            --generate-notes
            --latest=false
          )

          if [[ -n "${PREVIOUS_TAG}" ]]; then
            args+=(--notes-start-tag "${PREVIOUS_TAG}")
          fi

          gh release create "${args[@]}"
